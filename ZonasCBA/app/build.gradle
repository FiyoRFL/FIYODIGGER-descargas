plugins { id 'com.android.application' }

android {
    namespace 'com.fiyorfl.zonas'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fiyorfl.zonas'
        minSdk 23
        targetSdk 34
        versionCode 101
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
