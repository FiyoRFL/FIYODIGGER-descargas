body::after{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#252625}
.hero{padding:20px 16px 6px;text-align:center}
.hero img{width:min(100%,420px);height:auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.7))}
.lcd{max-width:420px;margin:14px auto 0;background:linear-gradient(#a9bd8c,#93a977);color:var(--lcdink);font:25px/1.1 LCD,monospace;padding:10px 14px;border-radius:8px;border:3px solid #0e130a;box-shadow:inset 0 0 24px rgba(10,20,5,.5),0 0 0 5px #181817;text-transform:uppercase}
.lcd small{display:block;font-size:20px;opacity:.75}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:10px;overflow-x:auto;padding:10px 12px;margin-top:14px;background:linear-gradient(#323332,#242524);border-block:2px solid #111;box-shadow:0 6px 10px rgba(0,0,0,.45)}
nav a,.all{flex:none;display:grid;place-items:center;min-height:44px;padding:0 14px;border-radius:7px;border:1px solid #5b574a;background:linear-gradient(#ddd7c4,#b6b09c);color:var(--ink);font:700 15px RC,sans-serif;text-decoration:none;white-space:nowrap;box-shadow:0 3px 0 #5d594b,0 5px 6px rgba(0,0,0,.5);text-transform:uppercase;letter-spacing:.5px}
nav a:active,.all:active{transform:translateY(3px);box-shadow:0 0 0 #5d594b}
main{max-width:720px;margin:0 auto;padding:16px 12px 44px;display:grid;gap:14px}
.tools{display:flex;justify-content:flex-end}.all{font-family:RC;cursor:pointer}
details{background:rgba(10,10,10,.34);border:2px solid #101010;border-radius:14px;box-shadow:inset 0 3px 9px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.16)}
summary{list-style:none;display:flex;align-items:center;gap:14px;padding:12px 14px;min-height:64px;cursor:pointer;font:700 20px/1.2 RC,sans-serif;color:var(--lab);text-shadow:0 1px 0 #000}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font:700 26px/1 RC;opacity:.8}
details[open]>summary::after{content:"\2212"}
.num{flex:none;width:42px;height:42px;border-radius:8px;display:grid;place-items:center;font:700 18px RC;color:var(--ink);text-shadow:none;background:linear-gradient(#ddd7c4,#b6b09c);box-shadow:0 3px 0 #5d594b}
details[open] .num{background:linear-gradient(#383837,#222221);color:#ebe7da;transform:translateY(2px);box-shadow:0 1px 0 #000}
.bd{padding:0 16px 18px}
.bd p{margin:.7em 0}
h4{font:700 18px/1.2 RC,sans-serif;letter-spacing:.8px;text-transform:uppercase;margin:1.5em 0 .5em;color:var(--lab);border-bottom:2px solid rgba(0,0,0,.5);padding-bottom:5px}
ol,ul{padding:0;margin:.6em 0;list-style:none}ol{counter-reset:s}
li{position:relative;padding:7px 0 7px 54px;min-height:44px}
ol li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:6px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 17px RC;color:var(--ink);background:linear-gradient(#ddd7c4,#b6b09c);box-shadow:0 3px 0 #5d594b}
ul li{padding:6px 0 6px 26px;min-height:0}
ul li::before{content:"";position:absolute;left:4px;top:.85em;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8e2d0,#7d7866)}
b{color:#fff}
kbd{font:700 .86em RC,sans-serif;background:linear-gradient(#ddd7c4,#b6b09c);color:var(--ink);padding:1px 8px;border-radius:5px;box-shadow:0 2px 0 #5d594b;white-space:nowrap;text-transform:uppercase}
code{font:1.15em LCD,monospace;background:rgba(0,0,0,.4);padding:0 6px;border-radius:4px;overflow-wrap:anywhere}
.n{margin:14px 0;padding:12px 14px;background:linear-gradient(#a9bd8c,#93a977);color:var(--lcdink);font:22px/1.2 LCD,monospace;border-radius:8px;border:3px solid #0e130a;box-shadow:inset 0 0 20px rgba(10,20,5,.45)}
.n b{color:var(--lcdink)}.n kbd{font-size:.8em}
.shot{display:block;max-width:100%;margin:10px 0 4px;border-radius:8px;border:2px solid #0e130a;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.vid{display:inline-block;margin:6px 0 10px;padding:10px 18px;font:700 15px RC,sans-serif;letter-spacing:1px;text-transform:uppercase;text-decoration:none;color:#fff;background:linear-gradient(#d2473a,#a32b20);border-radius:8px;box-shadow:0 3px 0 #5e170f}
.w{margin:14px 0;padding:12px 14px;border-left:6px solid #c13a2e;background:rgba(193,58,46,.16);border-radius:0 8px 8px 0}
.err{margin:12px 0;padding:12px;background:rgba(0,0,0,.3);border-radius:10px}
.err code{display:block;font:21px/1.15 LCD,monospace;background:var(--lcd);color:var(--lcdink);padding:6px 10px;border-radius:5px;margin-bottom:8px;text-transform:uppercase}
footer{text-align:center;padding:6px 16px 30px;font:700 13px RC,sans-serif;letter-spacing:1.5px;text-transform:uppercase;opacity:.7}

const S=[
["inicio","Start here",
"FIYODIGGER is your crate-digging machine: pull random records, give 'em a listen and take the sample straight to your DAW.",
["ol","Grab the version for your system at **fiyorfl.netlify.app/#fiyodigger** and install it. The first time, your system might throw a security warning: the download page shows you how to get past it.","Hit [[DIG]] or any pad. A record pops up and starts playing.","Pick the format, hit [[DOWNLOAD]] and drag the green button into your DAW."],
"n:Runs on Windows 10/11 (64-bit), Mac (M chip or Intel) and Android 10 or newer. On iPad and iPod you got FIYODIGGER Lite (section 12). You need internet."],
["claves","Get your keys",
"**You don't need any key to start:** FIYODIGGER comes hooked up to Discogs. Both keys here are **optional**.",
"h:Discogs token (optional)",
"Only if you wanna use your own Discogs account instead of the app's connection:",
["ol","Go to **discogs.com** and make an account, or log in.","Open the email Discogs sends you and tap the link to confirm.","Go to **discogs.com/settings/developers**.","Tap [[Generate new token]].","Copy the long string that shows up.","In FIYODIGGER go to [[F5 SETUP]] and paste it in “Discogs token”."],
"w:Treat the token like a password: don't share it. If it leaks, make a new one and the old one stops working.",
"h:YouTube key (optional)",
"v:https://drive.google.com/file/d/1ReLLBBL5Wy-YURXT4e_0qTTgsJ7oBOBj/view ▶ Watch the video tutorial (step by step, in Spanish)",
"Only needed for the **Views**, **Tags** and **Topic only** filters, and to see play counts. If you won't use those, skip this part.",
["ol", "Go to **console.cloud.google.com** with your Google account (first time? accept the terms) and tap **Select a project** (“Crea o selecciona un proyecto” in Spanish). @@yt1.webp", "Tap **New project**, name it **FIYODIGGER** and tap **Create**. @@yt2.webp", "Give it a few seconds. In the notifications bell (top right) you'll see “Create project: FIYODIGGER”: tap **Select project**. @@yt3.webp", "Open the three-line menu (top left) and go to **APIs & Services** → **Enabled APIs & services**. @@yt4.webp", "In the search bar up top type **YouTube** and pick **YouTube Data API v3**. @@yt5.webp", "Tap **Enable** and wait for it to load. @@yt6.webp", "In the left menu tap **Credentials**, then **+ Create credentials** → **API key**. @@yt7.webp", "Under “APIs this key can access” open the list, check only **YouTube Data API v3** and tap **OK**. Leave “Application restrictions” on **None**. Tap **Create**. @@yt8.webp", "You'll see “API key created”. Tap the copy button next to the key. @@yt9.webp", "In FIYODIGGER go to [[F5 SETUP]] and paste it in “YouTube key”. Done!"],
"n:It's free and shouldn't ask for a card. Google's menu names can change a little.",
"w:Always leave “Application restrictions” on **None**: picking websites, IP, Android or iOS breaks the app. Limiting it to YouTube Data API v3 (step 8) is all good.",
"w:The key is yours: don't share it or show it in videos or screenshots. If it leaks, delete it in **Credentials** and make a new one."],
["maquina","Know the machine",
["ul","**Green screen:** shows the record, filters, your favs and settings. At the bottom, a status line tells you what's going on.","[[F1]] to [[F5]]: switch screens (DIG, FILTER, FAVS, HISTORY, SETUP).","**16 pads:** each one is a ready-made style. Tap it and it digs a record in that style.","[[DIG]]: finds a random record with your filters.","[[SAVE]]: saves the record to favs.","[[FOLDER]]: opens the folder where your downloads land.","[[DISCOGS]]: opens the record's page in your browser.","[[MP3]] [[WAV]] [[FLAC]] and [[DOWNLOAD]]: grab what's playing. On Android, instead of FLAC you got [[ORIG]] (the original audio, no conversion).","**Video monitor:** the player in the middle, with [[◀ VIDEO]] and [[VIDEO ▶]] to switch tracks.","**DOWNLOADS tray:** shows what you grabbed, ready to drag into your DAW. The ✕ takes it off the list (it doesn't delete the file).","**On your phone:** the machine splits into tabs at the bottom: DIG, INFO, PADS and DOWNLOADS."]],
["digging","Digging",
["ol","Hit [[DIG]] or a pad, or press [[Space]].","The app searches Discogs and shows title, artist, year, country and label. The video starts on its own.","Not feeling it? Hit [[DIG]] again.","Feeling it? Hit [[SAVE]]. Find it later in [[F3 FAVS]]."],
"n:While you're listening, the app is already digging the next one: that's why it pops up instantly when you hit DIG.",
"h:Arrows on the waveform",
"Above the waveform there's an arrow on each side. [[▶]] goes to the next track on the record and, on the last one, brings a new record with your filters. [[◀]] goes back a track and, on the first one, to the previous record. Listen, skip ahead and switch without moving your hand. The [[◀ VIDEO]] and [[VIDEO ▶]] buttons do the same.",
"h:Follow the credits",
"Under the record info you get buttons for the artist, the label and the people who worked on it: {{ARRANGER}}, {{PRODUCER}}, {{ENGINEER}}, {{COMPOSER}} and {{CONDUCTOR}}. Tap one and the app brings more records from that person or label. To get out, tap {{[X]}} or any pad.",
"h:Waveform and jumps",
"The waveform shows up as soon as the video starts. Tap anywhere on it to skip ahead, or use {{[25%]}} {{[50%]}} {{[75%]}}, where the breaks usually live. Waveforms you already loaded get saved and come back instantly next time.",
"The app never repeats records you already dug, and it skips videos that got deleted or are blocked in your country."],
["pads","The 16 pads",
"Each pad applies a genre, style or region and digs right away. Out of the box: Soul, Funk, Jazz Funk, Soul Jazz, Library, Psych, Afro, Latin, Brazil, Bossa, Disco, Gospel, Tango, Cumbia, OST and Random (no filters).",
"h:Change a pad",
["ol","Go to [[F5 SETUP]] and tap {{[EDIT PADS]}}.","Tap the pad you wanna change.","Fill in name, genre, style, region and years. Years are optional.","Tap {{[SAVE PAD]}}. To go back to the original, {{[RESTORE]}}.","When you're done, tap {{[DONE]}}."],
"h:With the keyboard",
"[[1]] [[2]] [[3]] [[4]] / [[Q]] [[W]] [[E]] [[R]] / [[A]] [[S]] [[D]] [[F]] / [[Z]] [[X]] [[C]] [[V]] hit the pads in order. [[Space]] is DIG."],
["filtros","Filters (F2)",
"Open [[F2 FILTER]] to tighten up the search. Then tap {{[DIG IT]}} or [[DIG]].",
["ul","**Genre, Style and Region:** tap the field, search by typing and check what you want. You can pick a bunch.","**Mode button:** ANY = any of the ones you picked. ALL = all of them at once. EXCLUDE = none of them.","**Key and Tempo:** search by key (like A min) and by BPM. Desktop and Android only.","**Views:** min and max YouTube plays. Needs the YouTube key.","**Origin:** with Region, skips licensed pressings and artists from other countries.","**Year:** from and to.","**Rarity (HAVE MAX and WANT MIN):** cap how many people own it and set a minimum of people hunting it, to land on the gems.","**Tags** and **Topic only:** need the YouTube key.","**Vinyl only and Video only:** on by default. Uncheck 'em for more results."],
"h:Save your filters",
["ol","Build the combo.","Type a name and tap {{[SAVE]}}.","To use it later, pick it in “Saved”. {{[X]}} deletes it.","{{[RESET]}} clears everything."],
"n:No results? Ease up on a filter."],

["ul","**Discogs token** and **YouTube key:** where you paste 'em.","**Language:** {{[LANGUAGE]}} switches between Spanish and New York English. The first time, it uses your device's language.","**Skins:** {{[MODEL]}} changes everything at once (12 models). You can also change {{[CASE]}}, {{[MATERIAL]}}, {{[SCREEN]}}, {{[PADS]}} and {{[BUTTONS & LEDS]}} separately.","**Downloads folder:** tap it to pick another one (desktop).","**Edit pads** and **Manual:** {{[EDIT PADS]}} and {{[OPEN MANUAL]}}.","**Updates:** the app updates itself when it opens. {{[CHECK FOR UPDATES]}} does it right now, and {{[RESTART TO UPDATE]}} applies the new version without waiting.","**Diagnostics:** {{[DIAGNOSTICS]}} shows how the app is running. {{[CLEAN UP & RESTART ENGINE]}} kills stuck downloads."]],

const M=document.getElementById('m'),N=document.getElementById('nav');
S.forEach(([id,t,...it],i)=>{
  const d=document.createElement('details');d.id=id;if(!i)d.open=true;
  let h='';
  it.forEach(x=>{
    if(Array.isArray(x)){const k=x[0],r=x.slice(1);
      if(k==='err')h+=r.map(e=>`<div class="err"><code>${e[0]}</code><div>${f(e[1])}</div></div>`).join('');
      else h+=`<${k}>`+r.map(a=>`<li>${f(a)}</li>`).join('')+`</${k}>`;}
    else if(x.startsWith('n:'))h+=`<div class="n">${f(x.slice(2))}</div>`;
    else if(x.startsWith('w:'))h+=`<div class="w">${f(x.slice(2))}</div>`;
    else if(x.startsWith('v:')){const [u,...l]=x.slice(2).split(' ');h+=`<a class="vid" href="${u}" target="_blank" rel="noopener">${f(l.join(' '))}</a>`}
    else if(x.startsWith('h:'))h+=`<h4>${f(x.slice(2))}</h4>`;
    else h+=`<p>${f(x)}</p>`;
  });
  d.innerHTML=`<summary><span class="num">${String(i+1).padStart(2,'0')}</span><span>${t}</span></summary><div class="bd">${h}</div>`;
  M.append(d);N.insertAdjacentHTML('beforeend',`<a href="#${id}">${t}</a>`);
});
const all=document.getElementById('all');
all.onclick=()=>{const o=![...M.children].every(d=>d.open);M.querySelectorAll('details').forEach(d=>d.open=o);all.textContent=o?'Close all':'Open all'};
const go=()=>{const d=document.getElementById(location.hash.slice(1));if(d&&d.tagName==='DETAILS'){d.open=true;d.scrollIntoView()}};
addEventListener('hashchange',go);go();
</script></body></html>
